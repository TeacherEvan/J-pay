name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TRD consistency gate
        run: python3 scripts/check_consistency.py
      - name: Mermaid structural gate
        run: python3 scripts/check_diagrams.py
      - name: Unit tests (shift grammar + CSV guard)
        run: npm test
      - name: Typecheck (strict, incl. Convex functions)
        run: npx tsc --noEmit
